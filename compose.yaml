services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: templogin
      POSTGRES_DB: templogin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup first}
    volumes: [postgres:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U templogin"]
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres:
