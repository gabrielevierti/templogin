services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: templogin
      POSTGRES_DB: templogin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U templogin"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment:
      DATABASE_URL: postgres://templogin:${POSTGRES_PASSWORD}@db:5432/templogin
      PUBLIC_ORIGIN: https://${DOMAIN:?required}
      RP_ID: ${DOMAIN}
      TRUSTED_PROXY: 172.29.43.2
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80", "443:443"]
    volumes: ["./infra/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    networks:
      default:
        ipv4_address: 172.29.43.2
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres:
  caddy_data:
  caddy_config:

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.43.0/24
